name: Local candidate checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    # Ubuntu 24.04, linux/amd64. Upgrade this digest and the apt snapshot together.
    container: ubuntu@sha256:496754492fb28b4d3049432f2ca787449331e23fb14f0dd3fffea86bf5a93eb4
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Install tools from the fixed Ubuntu snapshot
        run: |
          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*
          cat > /etc/apt/sources.list.d/ubuntu.sources <<'EOF'
          Types: deb
          URIs: http://snapshot.ubuntu.com/ubuntu/20260928T000000Z/
          Suites: noble noble-updates noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Check-Valid-Until: no
          EOF
          # The minimal base has no CA bundle. Bootstrap it using signed apt
          # metadata, then use TLS for the remaining fixed-snapshot packages.
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          sed -i 's|http://snapshot|https://snapshot|' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install -y --no-install-recommends curl git make nodejs python3 dbus python3-dbus python3-gi openssl libicu74
          useradd --create-home lyric-ci
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Check source provenance is available
        run: git rev-parse --verify HEAD
      - name: Build, test and package as an unprivileged user
        run: |
          chown -R lyric-ci:lyric-ci "$GITHUB_WORKSPACE"
          runuser -u lyric-ci -- env HOME=/home/lyric-ci dotnet restore backend/LyricIsland.Backend --locked-mode
          runuser -u lyric-ci -- env HOME=/home/lyric-ci make test-backend
          runuser -u lyric-ci -- env HOME=/home/lyric-ci make package-local
      # No upload, release, tag, push, deployment or marketplace operation.
      # Native QML, SDK-hidden startup and desktop checks run on Omarchy.
      # Attach their results to the PR/release alongside CI artifacts.
